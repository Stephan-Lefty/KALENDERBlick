[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalenderblick"
version = "1.7.3"
description = "KALENDERBlick - zeigt Thunderbirds Kalender auf dem Schreibtisch und in der Kontrollleiste"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stephan Rösner" }]
keywords = ["thunderbird", "kalender", "calendar", "kde", "plasma", "desktop-widget"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: German",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = ["python-dateutil>=2.8", "icalendar>=5.0"]

[project.optional-dependencies]
fenster = ["PyQt6>=6.5"]
entwicklung = ["pytest>=7.4", "python-dateutil>=2.8"]

[project.scripts]
kalenderblick = "kalenderblick.cli:main"

[project.gui-scripts]
kalenderblick-fenster = "kalenderblick.cli:befehl_fenster"

[project.urls]
Quellcode = "https://github.com/Stephan-Lefty/KALENDERBlick"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
kalenderblick = ["bilder/*.png", "bilder/*.ico"]
"kalenderblick.hilfe" = ["*.md", "bilder/*.png"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
