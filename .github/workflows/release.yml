name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  # ── Debian .deb ──────────────────────────────────────────────────────────
  debian-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .deb bauen
        run: |
          set -e
          python3 -m venv venv
          venv/bin/pip install --quiet .
          VERSION=$(venv/bin/python3 -c "from kalenderblick import __version__; print(__version__)")
          PYVER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          PKG=deb_pkg
          mkdir -p "${PKG}/usr/bin" "${PKG}/usr/lib/python3/dist-packages" "${PKG}/DEBIAN" \
            "${PKG}/usr/share/applications" "${PKG}/usr/share/doc/kalenderblick"
          cp -r "venv/lib/python${PYVER}/site-packages/kalenderblick" "${PKG}/usr/lib/python3/dist-packages/"
          find "venv/lib/python${PYVER}/site-packages/" -maxdepth 1 -name 'kalenderblick*.dist-info' \
            -exec cp -r {} "${PKG}/usr/lib/python3/dist-packages/" \;
          for script in kalenderblick kalenderblick-fenster; do
            sed 's|^#!.*|#!/usr/bin/python3|' "venv/bin/${script}" > "${PKG}/usr/bin/${script}"
            chmod 755 "${PKG}/usr/bin/${script}"
          done
          cp packaging/kalenderblick.desktop "${PKG}/usr/share/applications/"
          cp packaging/kalenderblick.kwinrule "${PKG}/usr/share/doc/kalenderblick/"
          for groesse in 16 22 24 32 48 64 128 256 512; do
            mkdir -p "${PKG}/usr/share/icons/hicolor/${groesse}x${groesse}/apps"
            cp "src/kalenderblick/bilder/symbol-${groesse}.png" \
              "${PKG}/usr/share/icons/hicolor/${groesse}x${groesse}/apps/kalenderblick.png"
          done
          {
            echo "Package: kalenderblick"
            echo "Version: ${VERSION}"
            echo "Section: utils"
            echo "Priority: optional"
            echo "Architecture: all"
            echo "Maintainer: Stephan Roesner <stephan.roesner@protonmail.com>"
            echo "Depends: python3 (>= 3.9), python3-dateutil"
            echo "Recommends: python3-pyqt6"
            echo "Description: Thunderbirds Kalender auf dem Schreibtisch und in der Kontrollleiste"
            echo " Zeigt Termine aus Thunderbirds eigener Ablage an - nur lesen, nie schreiben."
          } > "${PKG}/DEBIAN/control"
          dpkg-deb --build --root-owner-group "${PKG}" "kalenderblick_${VERSION}_all.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: debian-deb
          path: kalenderblick_*.deb

  # ── Hochladen an die GitHub-Release ──────────────────────────────────────
  release-upload:
    needs: [debian-deb]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debian-deb
          path: artifacts/

      - name: Dateien hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --clobber
