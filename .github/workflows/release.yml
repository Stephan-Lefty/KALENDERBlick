name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:

  # ── Debian .deb ──────────────────────────────────────────────────────────
  #
  # Gebaut wird mit dpkg-buildpackage aus debian/, nicht mehr von Hand
  # mit dpkg-deb. Der Grund kam am 06.11.2026 vom Admin der
  # GuideOS-Distribution: Nur so kann eine Distribution das Paket selbst
  # nachbauen und aufnehmen. Dem alten Weg fehlten außerdem
  # /usr/share/doc/kalenderblick/copyright und changelog - beides
  # verlangt die Debian Policy (§12.5, §12.7), und die MIT-Lizenz lag
  # nur als Beifang im Python-Wheel.
  #
  # Im Container debian:trixie und nicht auf ubuntu-latest: Gebaut
  # werden soll gegen die Pakete, die das Zielsystem wirklich hat.
  debian-deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Werkzeuge für den Checkout
        # actions/checkout braucht git, und ein nacktes Debian-Abbild
        # bringt keines mit.
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Bauabhängigkeiten
        run: |
          apt-get install -y -qq --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject \
            python3-all python3-setuptools \
            python3-dateutil python3-icalendar python3-pyqt6 \
            python3-pytest lintian

      - name: .deb bauen
        run: dpkg-buildpackage -us -uc

      - name: lintian
        # Ein Befund hält die Veröffentlichung an. Lieber kein Paket als
        # eines, das eine Distribution hinterher zurückweist.
        run: lintian ../kalenderblick_*.deb

      - name: Probeinstallation und Rauchtest
        # Ein Paket, das baut, muss sich noch lange nicht installieren
        # lassen - und ein installiertes muss noch nicht starten.
        run: |
          apt-get install -y -qq ../kalenderblick_*.deb
          kalenderblick --version
          for pflicht in /usr/share/doc/kalenderblick/copyright \
                         /usr/share/doc/kalenderblick/changelog.gz \
                         /usr/share/man/man1/kalenderblick.1.gz \
                         /usr/share/applications/kalenderblick.desktop \
                         /usr/share/metainfo/io.github.stephan_lefty.kalenderblick.metainfo.xml; do
            test -e "$pflicht" || { echo "FEHLT im Paket: $pflicht"; exit 1; }
          done
          echo "Alle Pflichtdateien vorhanden."

      - name: Paket einsammeln
        run: |
          mkdir -p ausgabe
          cp ../kalenderblick_*.deb ausgabe/

      - uses: actions/upload-artifact@v4
        with:
          name: debian-deb
          path: ausgabe/kalenderblick_*.deb

  # ── Arch-Paket ───────────────────────────────────────────────────────────
  #
  # Damit Arch- und Manjaro-Nutzer eine fertige Datei bekommen, statt
  # selbst makepkg laufen zu lassen. Angeregt am 06.11.2026: Ein
  # Bekannter hatte sich das Paket von Hand gebaut - das sollte niemand
  # müssen.
  #
  # Das PKGBUILD lädt das Quellarchiv vom Tag, deshalb läuft dieser Job
  # erst, wenn der Tag steht (if: ref_type == 'tag').
  arch-paket:
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Bauwerkzeuge
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git sudo \
            python python-dateutil python-icalendar python-pyqt6 \
            python-build python-installer python-setuptools python-wheel \
            python-pytest

      - uses: actions/checkout@v4

      - name: Bauen
        # makepkg weigert sich, als root zu laufen - das ist Absicht und
        # lässt sich nicht abschalten. Also ein eigener Benutzer.
        run: |
          useradd -m bauer
          chown -R bauer:bauer "$GITHUB_WORKSPACE"
          cd packaging
          sudo -u bauer makepkg --nocheck --noconfirm
          mkdir -p "$GITHUB_WORKSPACE/ausgabe"
          cp kalenderblick-*.pkg.tar.* "$GITHUB_WORKSPACE/ausgabe/"

      - name: Probeinstallation
        # Ein Paket, das baut, muss sich noch lange nicht installieren
        # lassen.
        run: |
          pacman -U --noconfirm ausgabe/kalenderblick-*.pkg.tar.*
          kalenderblick --version
          for pflicht in /usr/share/licenses/kalenderblick/LICENSE \
                         /usr/share/applications/kalenderblick.desktop \
                         /usr/share/metainfo/io.github.stephan_lefty.kalenderblick.metainfo.xml; do
            test -e "$pflicht" || { echo "FEHLT im Paket: $pflicht"; exit 1; }
          done
          echo "Alle Pflichtdateien vorhanden."

      - uses: actions/upload-artifact@v4
        with:
          name: arch-paket
          path: ausgabe/kalenderblick-*.pkg.tar.*

  # ── Hochladen an die GitHub-Release ──────────────────────────────────────
  release-upload:
    needs: [debian-deb, arch-paket]
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debian-deb
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: arch-paket
          path: artifacts/

      - name: Dateien hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" \
            --clobber
