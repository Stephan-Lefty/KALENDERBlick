name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Systembibliotheken für Qt
        # Auch offscreen lädt Qt diese Bibliotheken beim Import - ohne
        # sie scheitert schon „import PyQt6.QtWidgets".
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Abhängigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[entwicklung]"
      - name: Oberfläche ist prüfbar
        # Eigener Schritt, damit ein fehlendes PyQt6 die CI rot macht,
        # statt sieben Testdateien still zu überspringen. Ein grüner
        # Lauf, der die halbe Oberfläche auslässt, ist schlimmer als
        # ein roter - er sieht aus wie eine Zusage.
        run: |
          QT_QPA_PLATFORM=offscreen python -c "import PyQt6.QtWidgets; print('PyQt6 da')"
      - name: Tests
        # -rs: Übersprungene Tests stehen am Ende namentlich da. Sonst
        # sieht ein Lauf mit vierzig Skips aus wie einer ohne.
        run: QT_QPA_PLATFORM=offscreen pytest -q -rs
